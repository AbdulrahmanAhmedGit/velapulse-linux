[package]
name = "velapulse"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Independent native Linux live activities"

[dependencies]
anyhow = "1"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "signal", "sync", "process"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
wayland-client = "0.31"

[profile.release]
lto = true
strip = true
