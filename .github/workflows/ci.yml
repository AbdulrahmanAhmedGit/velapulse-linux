name: CI
on: [push, pull_request]
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: sudo apt-get update && sudo apt-get install -y dbus python3-gi gjs gir1.2-adw-1 sway grim gir1.2-gtk4layershell-1.0 libgtk4-layer-shell0
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked --examples --bins
      - run: ./scripts/test-preferences-input.sh
      - run: ./scripts/test-context-ui.sh
        env:
          VELAPULSE_TEST_GRIM: grim
      - run: node tests/context-cards.mjs
      - run: ./scripts/test-phase34.sh
      - run: ./scripts/test-music.sh
      - run: ./scripts/test-music-input.sh
        env:
          VELAPULSE_TEST_NATIVE: '1'
          VELAPULSE_TEST_GRIM: grim
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase-1-2-evidence
          path: |
            target/preferences-input
            target/music-input
            target/phase-1-2
            target/phase-3-4
            target/context-ui
      - run: ./scripts/integration.sh
      - run: ./scripts/test-providers.sh
      - run: ./scripts/test-activation.sh
      - run: node --check extension/extension.js && node --check extension/preferences.js && node --check extension/prefs.js && node --check backends/layer-shell.js
      - run: node --check extension/music-controls.js && node --check extension/music-shell.js && node --check extension/music-preferences.js && node --check extension/lyrics-picker.js
      - run: node tests/presentation.mjs

      - run: node --check extension/context-state.js && node --check extension/context-preferences.js
